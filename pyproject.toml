[project]
name = "sigeci"
version = "0.1.0"
description = "SIGECI — Sistema Inteligente de Gestión de Correspondencia Institucional (ADEP)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[project.scripts]
sigeci = "wsgi:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
